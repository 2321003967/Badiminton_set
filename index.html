<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <meta name="description" content="Chia đội và quản lý trận đấu.">
  <title>Danh sách trận đấu</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <section class="panel players-panel" aria-labelledby="players-heading">
      <div class="section-heading">
        <h2 id="players-heading">Người chơi <span id="player-total" class="small-count">0</span></h2>
      </div>
      <form id="player-form" class="player-form">
        <label class="sr-only" for="player-name">Tên người chơi</label>
        <input id="player-name" name="player-name" type="text" placeholder="Nhập tên người chơi…" maxlength="60" autocomplete="off" required>
        <button class="button primary" type="submit">+ Thêm</button>
      </form>
      <ul id="player-list" class="player-list"></ul>
    </section>

    <section class="sets-section" aria-labelledby="sets-heading">
      <div class="section-heading sets-heading">
        <h2 id="sets-heading">Danh sách trận đấu</h2>
        <button id="add-set" class="button primary" type="button">+ Tạo trận</button>
      </div>
      <div class="tabs" role="tablist" aria-label="Trạng thái trận đấu">
        <button id="tab-pending" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="set-list" data-tab="pending">Chưa / đang đánh <span id="pending-total">0</span></button>
        <button id="tab-completed" class="tab" type="button" role="tab" aria-selected="false" aria-controls="set-list" tabindex="-1" data-tab="completed">Hoàn thành <span id="completed-total">0</span></button>
      </div>
      <div id="set-list" class="set-list" role="tabpanel" aria-labelledby="tab-pending"></div>
    </section>
    <div class="reset-actions">
      <button id="reset-data" class="button reset-button" type="button">Reset dữ liệu</button>
    </div>
  </main>
  <dialog id="reset-dialog" class="confirm-dialog" aria-labelledby="reset-title" aria-describedby="reset-description">
    <div class="dialog-content">
      <h2 id="reset-title">Xoá hết dữ liệu?</h2>
      <p id="reset-description">Xoá toàn bộ người chơi và trận đấu. Không thể khôi phục.</p>
      <div class="dialog-actions">
        <button id="cancel-reset" class="button secondary" type="button" autofocus>Huỷ</button>
        <button id="confirm-reset" class="button danger" type="button">Xoá tất cả</button>
      </div>
    </div>
  </dialog>
  <dialog id="delete-match-dialog" class="confirm-dialog" aria-labelledby="delete-match-title" aria-describedby="delete-match-description">
    <div class="dialog-content">
      <h2 id="delete-match-title">Xoá trận?</h2>
      <p id="delete-match-description">Không thể khôi phục sau khi xoá.</p>
      <div class="dialog-actions">
        <button id="cancel-delete-match" class="button secondary" type="button" autofocus>Huỷ</button>
        <button id="confirm-delete-match" class="button danger" type="button">Xoá trận</button>
      </div>
    </div>
  </dialog>
  <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
</body>
</html>
